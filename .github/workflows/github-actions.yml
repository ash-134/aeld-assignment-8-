name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-assignment-8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Server Compilation
        run: |
          cd server
          make clean
          make USE_AESD_CHAR_DEVICE=1
          echo "Server compilation passed!"
