name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-assignment-8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: List and Verify Repository Structure
        run: |
          echo "=== 目前倉庫中的檔案清單 ==="
          find . -maxdepth 3 -not -path '*/.*'
          echo "Assignment 8 結構檢查完成！"
