name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-assignment-8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Assignment 8 Source Structure
        run: |
          echo "檢查核心字元驅動程式..."
          test -f aesd-char-driver/main.c
          test -f aesd-char-driver/aesd-circular-buffer.c
          
          echo "檢查應用伺服器..."
          test -f server/aesdsocket.c
          
          echo "檢查 Buildroot ldd 套件設定..."
          test -f base_external/package/ldd/ldd.mk
          
          echo "Assignment 8 檔案結構驗證 100% 通過！"
