name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-assignment-8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Assignment 8 Files and Server Compilation
        run: |
          echo "檢查 aesd-char-driver 原始碼..."
          test -f aesd-char-driver/main.c
          test -f aesd-char-driver/aesd-circular-buffer.c
          test -f aesd-char-driver/aesd-circular-buffer.h
          
          echo "檢查 server 應用程式..."
          test -f server/aesdsocket.c
          
          echo "檢查 Buildroot ldd 套件與開機腳本..."
          test -f base_external/package/ldd/ldd.mk
          test -x base_external/rootfs_overlay/etc/init.d/S98lddmodules
          
          echo "編譯 server 應用程式..."
          make -C server clean
          make -C server USE_AESD_CHAR_DEVICE=1
          
          echo "Assignment 8 檢查 100% 通過！"
